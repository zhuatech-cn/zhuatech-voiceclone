services:
  api:
    build: ./backend
    environment:
      ZHUATECH_PRACTICAL_TOKEN: ${ZHUATECH_PRACTICAL_TOKEN:-}
      ZHUATECH_AUDIO_PROVIDER: ${ZHUATECH_AUDIO_PROVIDER:-local}
      ZHUATECH_AUDIO_BASE_URL: ${ZHUATECH_AUDIO_BASE_URL:-}
      ZHUATECH_AUDIO_MODEL: ${ZHUATECH_AUDIO_MODEL:-voice-clone-provider-model}
      ZHUATECH_AUDIO_API_KEY: ${ZHUATECH_AUDIO_API_KEY:-}
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "if command -v nc >/dev/null 2>&1; then nc -z 127.0.0.1 8080; else bash -c '</dev/tcp/127.0.0.1/8080'; fi"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 15s
  web:
    image: nginx:1.27-alpine
    volumes: ["./frontend:/usr/share/nginx/html:ro", "./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["8088:80"]

    depends_on:
      api:
        condition: service_healthy
